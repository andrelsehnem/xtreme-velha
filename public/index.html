<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Jogo da velha em nove tabuleiros: cada jogada decide onde será a próxima." />
    <meta name="theme-color" content="#fff6ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17100e" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Splash da web: fundo do tema e o símbolo do jogo enquanto o app carrega.
         Cores e imagens vêm de scripts/generate-assets.js. -->
    <style id="splash">
      body {
        background: #fff6ec url('/splash.png') center / 96px no-repeat;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #17100e;
        }
      }
    </style>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
